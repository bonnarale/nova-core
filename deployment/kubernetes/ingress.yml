apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nova-core-ingress
  labels:
    app: nova-core
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: nova-core.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nova-core-service
                port:
                  number: 8000
  tls:
    - hosts:
        - nova-core.example.com
      secretName: nova-core-tls
