name: nova_core_mobile
description: NOVA CORE Mobile Platform - Flutter client for autonomous AI system management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  json_annotation: ^4.8.1
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^17.0.0
  url_launcher: ^6.2.2
  go_router: ^14.0.0
  intl: ^0.19.0
  equatable: ^2.0.5
  collection: ^1.18.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.8
  mockito: ^5.4.4
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/
