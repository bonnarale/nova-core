name: nova-core

services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.dashboard=true
      - --ping=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - nova_public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-NOVA CORE}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:-nova_core}
      POSTGRES_USER: ${POSTGRES_USER:-nova_core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova-core-postgres-password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nova-core-redis-password}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      ANONYMIZED_TELEMETRY: "FALSE"
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
      NOVA_AUTONOMOUS_ENABLED: ${NOVA_AUTONOMOUS_ENABLED:-true}
      NOVA_AUTONOMOUS_USER_ID: ${NOVA_AUTONOMOUS_USER_ID:-}
      NOVA_AUTONOMOUS_INTERVAL_SECONDS: ${NOVA_AUTONOMOUS_INTERVAL_SECONDS:-3600}
      NOVA_AUTONOMOUS_MAX_GOALS_PER_CYCLE: ${NOVA_AUTONOMOUS_MAX_GOALS_PER_CYCLE:-5}
      NOVA_TOKEN_SECRET: ${NOVA_TOKEN_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - nova_public
      - nova_internal
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_core}
      POSTGRES_USER: ${POSTGRES_USER:-nova_core}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova-core-postgres-password}
      N8N_POSTGRES_DB: ${N8N_POSTGRES_DB:-n8n}
      N8N_POSTGRES_USER: ${N8N_POSTGRES_USER:-n8n}
      N8N_POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-nova-core-n8n-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nova_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nova-core-redis-password}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-nova-core-redis-password}"]
    volumes:
      - redis_data:/data
    networks:
      - nova_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  chroma:
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - nova_internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    ports:
    - "11434:11434"
    dns:
    - 8.8.8.8
    - 1.1.1.1
    dns_opt:
    - single-request-reopen
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nova_internal
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.3.35
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-nova-core-open-webui-secret-key}
      ENABLE_SIGNUP: "false"
      DEFAULT_MODELS: ${OPEN_WEBUI_DEFAULT_MODELS:-llama3.2}
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      CORS_ALLOW_ORIGIN: http://${OPEN_WEBUI_HOST:-webui.localhost}
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - nova_public
      - nova_internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  n8n:
    image: n8nio/n8n:1.60.1
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-nova-core-n8n-postgres-password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-nova-core-n8n-encryption-key-32}
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-nova-core-n8n-admin-password}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      WEBHOOK_URL: http://${N8N_HOST:-n8n.localhost}/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nova_public
      - nova_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  nova_public:
    name: nova-core_nova_public
    driver: bridge
  nova_internal:
    driver: bridge
    name: nova-core_nova_internal

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
  open_webui_data:
  n8n_data:
